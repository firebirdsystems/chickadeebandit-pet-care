<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Care</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #111827);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-fg:    var(--hub-primary-fg, #ffffff);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-light: #f3f4f6;
      --green-rgb: 22, 163, 74; --amber-rgb: 217, 119, 6; --red-rgb: 220, 38, 38;
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: var(--hub-font-size, 15px);
      line-height: 1.5;
    }

    .app { max-width: 640px; margin: 0 auto; padding: 16px; }

    /* ── Header ──────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding: 14px 18px;
      background: var(--accent);
      border-radius: var(--radius);
      color: white;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; }
    header .sub { font-size: 0.8rem; opacity: .75; margin-top: 1px; }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px;
      font-size: 0.875rem; font-weight: 600;
      cursor: pointer; border: none; transition: opacity .15s;
    }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-primary  { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled)  { opacity: .88; }
    .btn-ghost    { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
    .btn-ghost:hover  { border-color: var(--text); color: var(--text); }
    .btn-danger   { background: #dc2626; color: white; }
    .btn-danger:hover:not(:disabled)   { opacity: .88; }
    .btn-icon     { background: rgba(255,255,255,.2); color: white; border: none; font-size: 1.2rem; padding: 6px 10px; border-radius: 8px; }
    .btn-icon:hover { background: rgba(255,255,255,.3); }
    .btn-sm       { padding: 5px 12px; font-size: 0.8rem; }

    /* ── Pet tabs ────────────────────────────────────────── */
    .pet-tabs {
      display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .pet-tab {
      padding: 6px 14px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--card);
      font-size: 0.88rem; font-weight: 600; cursor: pointer;
      transition: all .15s; color: var(--muted);
    }
    .pet-tab.active { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }

    /* ── Activity card grid ──────────────────────────────── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }

    .activity-card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: border-color .2s;
    }
    .activity-card:hover { border-color: color-mix(in srgb, var(--status-color) 60%, var(--border)); }

    .card-body {
      padding: 14px 16px 10px;
      flex: 1;
    }
    .card-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .card-icon   { font-size: 1.5rem; line-height: 1; flex-shrink: 0; }
    .card-name   { font-weight: 700; font-size: 1rem; flex: 1; }
    .status-dot  {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--status-color, #6b7280);
      flex-shrink: 0;
    }

    .card-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--status-color, var(--muted));
      margin-bottom: 6px;
    }

    /* ── Last done by ────────────────────────────────────── */
    .card-last-by {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .card-last-by .by-avatar {
      width: 20px; height: 20px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 0.62rem; font-weight: 700; color: white; flex-shrink: 0;
    }
    .card-last-by strong { color: var(--text); font-weight: 600; }

    /* ── Progress bar ────────────────────────────────────── */
    .progress-track {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 8px 0 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 2px;
      background: var(--status-color, var(--muted));
      width: calc(var(--status-pct, 0) * 100%);
      transition: width .4s ease, background .4s ease;
    }

    /* ── Done button ─────────────────────────────────────── */
    .done-btn {
      width: 100%;
      padding: 11px;
      border: none;
      font-size: 0.9rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      background: var(--status-color, #6b7280);
      transition: opacity .15s, background .4s ease;
      letter-spacing: .02em;
    }
    .done-btn:active { opacity: .8; }
    .done-btn:hover  { opacity: .92; }

    /* ── Tabs ────────────────────────────────────────────── */
    .tabs {
      display: flex; gap: 4px;
      background: var(--border); border-radius: 10px;
      padding: 3px; margin-bottom: 14px;
    }
    .tab {
      flex: 1; padding: 7px; border-radius: 8px; border: none;
      cursor: pointer; font-size: 0.85rem; font-weight: 600;
      color: var(--muted); background: transparent; transition: all .15s;
    }
    .tab.active { background: white; color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }

    /* ── Modal ───────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 100;
    }
    @media (min-width: 480px) { .modal-backdrop { align-items: center; padding: 20px; } }
    .modal {
      background: white; border-radius: var(--radius) var(--radius) 0 0;
      width: 100%; max-width: 520px; padding: 22px;
      max-height: 92vh; overflow-y: auto;
    }
    @media (min-width: 480px) { .modal { border-radius: var(--radius); } }

    /* ── Form ────────────────────────────────────────────── */
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-size: 0.78rem; font-weight: 700;
      color: var(--muted); margin-bottom: 5px;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group input[type="time"],
    .form-group select {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 9px 12px; font-size: 0.95rem; outline: none;
      transition: border-color .15s; background: white; font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--accent); }

    .muted-label { font-weight: 400; text-transform: none; color: var(--muted); }

    /* ── Emoji / icon grid ───────────────────────────────── */
    .emoji-grid {
      display: flex; flex-wrap: wrap; gap: 6px;
    }
    .emoji-btn {
      width: 38px; height: 38px; border-radius: 8px;
      border: 1.5px solid var(--border); background: var(--bg);
      font-size: 1.2rem; cursor: pointer; transition: all .12s;
      display: flex; align-items: center; justify-content: center;
    }
    .emoji-btn:hover   { border-color: var(--accent); background: var(--accent-light); }
    .emoji-btn.selected { border-color: var(--accent); background: var(--accent-light); box-shadow: 0 0 0 2px var(--accent); }

    /* ── Radio schedule type ─────────────────────────────── */
    .radio-group { display: flex; gap: 10px; flex-wrap: wrap; }
    .radio-opt {
      display: flex; align-items: center; gap: 7px;
      padding: 8px 14px; border-radius: 8px;
      border: 1.5px solid var(--border); cursor: pointer;
      font-size: 0.88rem; font-weight: 500; color: var(--muted);
      transition: all .12s;
    }
    .radio-opt:has(input:checked) { border-color: var(--accent); background: var(--accent-light); color: var(--accent); }
    .radio-opt input { accent-color: var(--accent); }

    /* ── Time rows ───────────────────────────────────────── */
    .time-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .time-input { width: auto !important; flex: 1; }

    /* ── Modal actions ───────────────────────────────────── */
    .modal-actions { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
    .modal-actions .btn { flex: 1; justify-content: center; min-width: 90px; }

    /* ── Settings rows ───────────────────────────────────── */
    .settings-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .settings-header h3 { font-size: 1.1rem; font-weight: 700; }
    .settings-section { }
    .settings-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row .info { flex: 1; font-size: 0.88rem; }
    .settings-row .sched-meta { font-size: 0.78rem; color: var(--muted); }
    .act-list { margin: 4px 0 6px 10px; padding-left: 10px; border-left: 2px solid var(--border); }
    .act-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
    .act-row:last-child { border-bottom: none; }
    .act-row .info { flex: 1; font-size: 0.83rem; }

    /* ── Misc ────────────────────────────────────────────── */
    .empty       { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 0.9rem; }
    .empty-sm    { font-size: 0.85rem; color: var(--muted); padding: 8px 0; }
    .loading     { text-align: center; padding: 40px; color: var(--muted); }
    .muted       { color: var(--muted); }
  </style>
  <base href="/run/pet-care/" />
</head>
<body>
<div class="app">
  <div id="root"><div class="loading">Loading…</div></div>
</div>

<script type="module">
import { memberColor, initial, esc, isAdult, hubConfirm } from "/hub-sdk.js";
import { formatDuration, statusColor, activityStatusInterval, activityStatusTimes } from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB      = window.__DB_URL      ?? "";
const ME      = window.__CURRENT_MEMBER ?? null;

// ─── State ────────────────────────────────────────────────────────────────
const mc = (id) => memberColor(id, members);

let members      = [];
let pets         = [];
let activities   = []; // all activities across all pets
let lastLogs     = {}; // activityId → most recent log row
let selectedPetId  = null;
let actFormPetId   = null; // pet context for the open activity form
let refreshTimer   = null;

// ─── DB helper ────────────────────────────────────────────────────────────
async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  return res.json();
}

// ─── DB init ──────────────────────────────────────────────────────────────
async function initDb() {
  // Schema is managed by hub migrations (migrations/001_init.sql)
}

// ─── Load ─────────────────────────────────────────────────────────────────
async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex",   role: "adult" },
      { id: "demo-2", name: "Jordan", role: "child" },
      { id: "demo-3", name: "Casey",  role: "child" },
    ];
    return;
  }
  try {
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    members = ((await res.json())["family.members"]) ?? [];
  } catch { members = []; }
}

async function loadPets() {
  const { rows } = await db(`SELECT * FROM pets ORDER BY created_at`);
  pets = rows ?? [];
}

async function loadActivities() {
  const { rows } = await db(`SELECT * FROM activities ORDER BY pet_id, sort_order, created_at`);
  activities = (rows ?? []).map(r => ({ ...r, times: JSON.parse(r.times ?? "[]") }));
}

async function loadLastLogs() {
  lastLogs = {};
  const curActs = activities.filter(a => a.pet_id === selectedPetId);
  if (!curActs.length) return;
  const ids = curActs.map(a => a.id);
  const placeholders = ids.map(() => "?").join(",");
  const { rows } = await db(`
    SELECT l.* FROM logs l
    INNER JOIN (
      SELECT activity_id, MAX(done_at) AS max_done FROM logs
      WHERE activity_id IN (${placeholders})
      GROUP BY activity_id
    ) m ON l.activity_id = m.activity_id AND l.done_at = m.max_done
  `, ids);
  for (const row of rows ?? []) lastLogs[row.activity_id] = row;
}

// ─── Status computation ───────────────────────────────────────────────────
function fmtTime(date) {
  return date.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

function activityStatus(activity) {
  const log = lastLogs[activity.id];
  const now = new Date();

  function lastByInfo() {
    if (!log) return null;
    return {
      member: members.find(m => m.id === log.done_by) ?? null,
      agoMin: (now - new Date(log.done_at)) / 60000,
    };
  }

  if (activity.schedule_type === "interval") {
    const s = activityStatusInterval(activity, log, members, now);
    return { ...s, lastBy: lastByInfo() };
  }

  if (activity.schedule_type === "times") {
    const s = activityStatusTimes(activity, log, now);
    return { ...s, lastBy: lastByInfo() };
  }

  return { pct: 0, label: "", lastBy: null };
}

// ─── Mark done ────────────────────────────────────────────────────────────
async function markDone(activityId) {
  if (!ME) return;
  const id  = crypto.randomUUID();
  const now = new Date().toISOString();
  // Insert new log, then immediately prune — table stays at 1 row per activity
  await db(`INSERT INTO logs (id, activity_id, pet_id, done_by, done_at) VALUES (?, ?, ?, ?, ?)`,
    [id, activityId, selectedPetId, ME.id, now]);
  await db(`DELETE FROM logs WHERE activity_id = ? AND id != ?`, [activityId, id]);
  lastLogs[activityId] = { id, activity_id: activityId, pet_id: selectedPetId, done_by: ME.id, done_at: now };
  renderMain();
}

// ─── Admin CRUD ───────────────────────────────────────────────────────────
async function savePet(fields, id = null) {
  const now = new Date().toISOString();
  if (id) {
    await db(`UPDATE pets SET name = ?, species = ?, emoji = ? WHERE id = ?`,
      [fields.name, fields.species, fields.emoji, id]);
    pets = pets.map(p => p.id === id ? { ...p, ...fields } : p);
  } else {
    const newId = crypto.randomUUID();
    await db(`INSERT INTO pets (id, name, species, emoji, created_at) VALUES (?, ?, ?, ?, ?)`,
      [newId, fields.name, fields.species, fields.emoji, now]);
    pets = [...pets, { id: newId, ...fields, created_at: now }];
    if (!selectedPetId) selectedPetId = newId;
  }
}

async function deletePet(id) {
  if (!await hubConfirm({ message: "Delete this pet?", description: "All care data for this pet will be permanently removed.", confirmLabel: "Delete pet" })) return false;
  await db(`DELETE FROM pets WHERE id = ?`, [id]);
  await db(`DELETE FROM activities WHERE pet_id = ?`, [id]);
  await db(`DELETE FROM logs WHERE pet_id = ?`, [id]);
  pets = pets.filter(p => p.id !== id);
  activities = activities.filter(a => a.pet_id !== id);
  if (selectedPetId === id) {
    selectedPetId = pets[0]?.id ?? null;
    lastLogs = {};
    if (selectedPetId) await loadLastLogs();
  }
  return true;
}

async function saveActivity(fields, id = null) {
  const now = new Date().toISOString();
  const petId = actFormPetId ?? selectedPetId;
  const timesJson = JSON.stringify(fields.times ?? []);
  if (id) {
    await db(`UPDATE activities SET name = ?, icon = ?, schedule_type = ?, interval_hours = ?, times = ? WHERE id = ?`,
      [fields.name, fields.icon, fields.schedule_type, fields.interval_hours ?? null, timesJson, id]);
    activities = activities.map(a => a.id === id ? { ...a, ...fields, times: fields.times ?? [] } : a);
  } else {
    const newId = crypto.randomUUID();
    const order = activities.filter(a => a.pet_id === petId).length;
    await db(`INSERT INTO activities (id, pet_id, name, icon, schedule_type, interval_hours, times, sort_order, created_at)
              VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)`,
      [newId, petId, fields.name, fields.icon, fields.schedule_type,
       fields.interval_hours ?? null, timesJson, order, now]);
    activities = [...activities, { id: newId, pet_id: petId, ...fields, times: fields.times ?? [], sort_order: order }];
    if (fields.lastDoneAt) {
      const logId = crypto.randomUUID();
      await db(`INSERT INTO logs (id, activity_id, pet_id, done_by, done_at) VALUES (?, ?, ?, ?, ?)`,
        [logId, newId, petId, ME.id, fields.lastDoneAt]);
      lastLogs[newId] = { id: logId, activity_id: newId, pet_id: petId, done_by: ME.id, done_at: fields.lastDoneAt };
    }
  }
}

async function deleteActivity(id) {
  if (!await hubConfirm({ message: "Delete this activity?", description: "The activity and its log history will be permanently removed.", confirmLabel: "Delete" })) return false;
  await db(`DELETE FROM activities WHERE id = ?`, [id]);
  await db(`DELETE FROM logs WHERE activity_id = ?`, [id]);
  activities = activities.filter(a => a.id !== id);
  delete lastLogs[id];
  return true;
}

// ─── Modal ────────────────────────────────────────────────────────────────
let modalEl = null;
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
}
function closeModal() { modalEl?.remove(); modalEl = null; }

// ─── Render main ──────────────────────────────────────────────────────────
function renderCard(activity) {
  const { pct, label, lastBy } = activityStatus(activity);
  const color    = statusColor(pct);
  const pctClamp = Math.min(1, pct);

  let lastByHtml = "";
  if (lastBy) {
    const name  = lastBy.member?.name ?? "Someone";
    const color = mc(lastBy.member?.id ?? "");
    const ago   = formatDuration(lastBy.agoMin);
    lastByHtml = `
      <div class="card-last-by">
        <span class="by-avatar" style="background:${color}">${initial(name)}</span>
        <span><strong>${esc(name)}</strong> · ${ago} ago</span>
      </div>`;
  } else {
    lastByHtml = `<div class="card-last-by" style="font-style:italic">Never done</div>`;
  }

  return `
    <div class="activity-card" style="--status-color:${color};--status-pct:${pctClamp.toFixed(3)}">
      <div class="card-body">
        <div class="card-top">
          <span class="card-icon">${activity.icon}</span>
          <span class="card-name">${esc(activity.name)}</span>
          <span class="status-dot"></span>
        </div>
        <div class="card-label">${label}</div>
        ${lastByHtml}
        <div class="progress-track"><div class="progress-fill"></div></div>
      </div>
      <button class="done-btn" onclick="markDone('${activity.id}')">✓ Done</button>
    </div>
  `;
}

function renderMain() {
  const pet       = pets.find(p => p.id === selectedPetId);
  const meIsAdmin = isAdult(ME);

  const petTabsHtml = pets.length > 1
    ? `<div class="pet-tabs">${pets.map(p =>
        `<button class="pet-tab ${p.id === selectedPetId ? "active" : ""}" onclick="selectPet('${p.id}')">${p.emoji} ${esc(p.name)}</button>`
      ).join("")}</div>`
    : "";

  const curActs = activities.filter(a => a.pet_id === selectedPetId);
  let bodyHtml;
  if (pets.length === 0) {
    bodyHtml = meIsAdmin
      ? `<div class="empty">No pets yet. Tap ⚙️ to add your first pet.</div>`
      : `<div class="empty">No pets configured yet.</div>`;
  } else if (curActs.length === 0) {
    bodyHtml = meIsAdmin
      ? `<div class="empty">No activities for ${esc(pet?.name ?? "this pet")} yet. Tap ⚙️ to add some.</div>`
      : `<div class="empty">No activities configured yet.</div>`;
  } else {
    bodyHtml = `<div class="card-grid">${curActs.map(renderCard).join("")}</div>`;
  }

  document.getElementById("root").innerHTML = `
    <header>
      <div>
        <h1>${pet ? `${pet.emoji} ${esc(pet.name)}` : "🐾 Pet Care"}</h1>
        <div class="sub">${pet?.species ? esc(pet.species) : "Care tracker"}</div>
      </div>
      ${meIsAdmin ? `<button class="btn btn-icon" onclick="openSettings()" title="Settings">⚙️</button>` : ""}
    </header>
    ${petTabsHtml}
    ${bodyHtml}
  `;
}

// ─── Settings modal ───────────────────────────────────────────────────────
function renderSettingsModal() {
  const schedLabel = (a) => a.schedule_type === "interval"
    ? `Every ${a.interval_hours}h`
    : `${(a.times ?? []).join(", ")}`;

  const petsHtml = pets.map(p => {
    const pActs = activities.filter(a => a.pet_id === p.id);
    const actsHtml = pActs.map(a => `
      <div class="act-row">
        <div class="info"><strong>${a.icon} ${esc(a.name)}</strong> <span class="sched-meta">${schedLabel(a)}</span></div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button class="btn btn-ghost btn-sm" onclick="openActivityForm('${a.id}')">Edit</button>
          <button class="btn btn-danger btn-sm" onclick="doDeleteActivity('${a.id}')">Delete</button>
        </div>
      </div>`).join("");
    return `
      <div class="settings-row" style="flex-direction:column;align-items:stretch;gap:0">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
          <div class="info">
            <strong>${p.emoji} ${esc(p.name)}</strong>
            ${p.species ? `<span class="muted"> · ${esc(p.species)}</span>` : ""}
          </div>
          <div style="display:flex;gap:6px;flex-shrink:0">
            <button class="btn btn-ghost btn-sm" onclick="openPetForm('${p.id}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="doDeletePet('${p.id}')">Delete</button>
          </div>
        </div>
        <div class="act-list">
          ${actsHtml || `<div class="empty-sm">No activities yet.</div>`}
          <button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="openActivityForm(null,'${p.id}')">+ Add Activity</button>
        </div>
      </div>`;
  }).join("") || `<div class="empty-sm">No pets yet.</div>`;

  openModal(`
    <div class="settings-header">
      <h3>⚙️ Pets &amp; Activities</h3>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Done</button>
    </div>
    ${petsHtml}
    <div style="margin-top:14px">
      <button class="btn btn-primary btn-sm" onclick="openPetForm()">+ Add Pet</button>
    </div>
  `);
}

window.doDeletePet = async function(id) {
  const ok = await deletePet(id);
  if (ok) { renderSettingsModal(); renderMain(); }
};
window.doDeleteActivity = async function(id) {
  const ok = await deleteActivity(id);
  if (ok) { renderSettingsModal(); renderMain(); }
};

// ─── Pet form ─────────────────────────────────────────────────────────────
const PET_EMOJIS = ["🐶","🐱","🐰","🐹","🐭","🐸","🦜","🐢","🐠","🐍","🦎","🐓","🐄","🐑","🦙","🐾"];

function openPetForm(id = null) {
  const pet = id ? pets.find(p => p.id === id) : null;
  const sel = pet?.emoji ?? "🐾";
  const emojiGrid = PET_EMOJIS.map(e =>
    `<button type="button" class="emoji-btn ${sel === e ? "selected" : ""}" onclick="pickPetEmoji(this,'${e}')">${e}</button>`
  ).join("");

  openModal(`
    <h3 style="margin-bottom:16px">${pet ? "Edit Pet" : "Add Pet"}</h3>
    <input type="hidden" id="pf-emoji" value="${sel}" />
    <div class="form-group">
      <label>Icon</label>
      <div class="emoji-grid">${emojiGrid}</div>
    </div>
    <div class="form-group">
      <label>Name</label>
      <input id="pf-name" type="text" value="${esc(pet?.name ?? "")}" placeholder="Buddy" autofocus />
    </div>
    <div class="form-group">
      <label>Species / Breed <span class="muted-label">(optional)</span></label>
      <input id="pf-species" type="text" value="${esc(pet?.species ?? "")}" placeholder="Golden Retriever" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="backToSettings()">Back</button>
      <button class="btn btn-primary" onclick="submitPet('${id ?? ""}')">${pet ? "Save" : "Add Pet"}</button>
    </div>
  `);
}

window.pickPetEmoji = function(btn, e) {
  document.getElementById("pf-emoji").value = e;
  btn.closest(".emoji-grid").querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
};

window.submitPet = async function(existingId) {
  const name    = document.getElementById("pf-name").value.trim();
  const species = document.getElementById("pf-species").value.trim();
  const emoji   = document.getElementById("pf-emoji").value;
  if (!name) { document.getElementById("pf-name").focus(); return; }
  const btn = modalEl?.querySelector('.modal-actions .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  await savePet({ name, species, emoji }, existingId || null);
  renderSettingsModal();
  renderMain();
};

// ─── Activity form ────────────────────────────────────────────────────────
const ACT_ICONS = ["🍽️","💊","🚽","🦮","🛁","😴","💉","🦷","👁️","✂️","🎾","💧","🌿","🧸","🏃","🐾"];

function openActivityForm(id = null, petId = null) {
  actFormPetId = id ? (activities.find(a => a.id === id)?.pet_id ?? selectedPetId) : (petId ?? selectedPetId);
  const act   = id ? activities.find(a => a.id === id) : null;
  const sched = act?.schedule_type ?? "interval";
  const sel   = act?.icon ?? "🍽️";

  const iconGrid = ACT_ICONS.map(e =>
    `<button type="button" class="emoji-btn ${sel === e ? "selected" : ""}" onclick="pickActIcon(this,'${e}')">${e}</button>`
  ).join("");

  const timesHtml = (act?.times ?? []).map(t => `
    <div class="time-row">
      <input class="time-input" type="time" value="${t}" />
      <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.time-row').remove()">✕</button>
    </div>
  `).join("");

  openModal(`
    <h3 style="margin-bottom:16px">${act ? "Edit Activity" : "Add Activity"}</h3>
    <input type="hidden" id="af-icon" value="${sel}" />
    <div class="form-group">
      <label>Icon</label>
      <div class="emoji-grid">${iconGrid}</div>
    </div>
    <div class="form-group">
      <label>Activity name</label>
      <input id="af-name" type="text" value="${esc(act?.name ?? "")}" placeholder="Feeding, Medication, Potty Break…" autofocus />
    </div>
    <div class="form-group">
      <label>Schedule</label>
      <div class="radio-group">
        <label class="radio-opt">
          <input type="radio" name="sched" value="interval" ${sched === "interval" ? "checked" : ""} onchange="toggleSched(this)" />
          Every N hours
        </label>
        <label class="radio-opt">
          <input type="radio" name="sched" value="times" ${sched === "times" ? "checked" : ""} onchange="toggleSched(this)" />
          At specific times
        </label>
      </div>
    </div>
    <div id="sched-interval" style="${sched !== "interval" ? "display:none" : ""}">
      <div class="form-group">
        <label>Interval (hours)</label>
        <input id="af-hours" type="number" min="0.25" max="168" step="0.25" value="${act?.interval_hours ?? 8}" style="max-width:140px" />
      </div>
      ${!act ? `<div class="form-group"><label>Last done <span class="muted-label">(optional)</span></label><input id="af-lastdone" type="date" style="max-width:180px" max="${new Date().toISOString().slice(0,10)}" /></div>` : ""}
    </div>
    <div id="sched-times" style="${sched !== "times" ? "display:none" : ""}">
      <div class="form-group">
        <label>Times of day</label>
        <div id="times-list">${timesHtml}</div>
        <button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="addTimeRow()">+ Add time</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="backToSettings()">Back</button>
      <button class="btn btn-primary" onclick="submitActivity('${id ?? ""}')">${act ? "Save" : "Add Activity"}</button>
    </div>
  `);
}

window.pickActIcon = function(btn, e) {
  document.getElementById("af-icon").value = e;
  btn.closest(".emoji-grid").querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
  btn.classList.add("selected");
};

window.toggleSched = function(radio) {
  document.getElementById("sched-interval").style.display = radio.value === "interval" ? "" : "none";
  document.getElementById("sched-times").style.display    = radio.value === "times"    ? "" : "none";
};

window.addTimeRow = function() {
  const row = document.createElement("div");
  row.className = "time-row";
  row.innerHTML = `<input class="time-input" type="time" value="08:00" /><button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.time-row').remove()">✕</button>`;
  document.getElementById("times-list").appendChild(row);
};

window.submitActivity = async function(existingId) {
  const name  = document.getElementById("af-name").value.trim();
  const icon  = document.getElementById("af-icon").value;
  const sched = document.querySelector("input[name='sched']:checked")?.value ?? "interval";
  if (!name) { document.getElementById("af-name").focus(); return; }

  let interval_hours = null, times = [], lastDoneAt = null;
  const btn = modalEl?.querySelector('.modal-actions .btn-primary');
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  if (sched === "interval") {
    interval_hours = parseFloat(document.getElementById("af-hours").value) || 8;
    const lastDoneVal = document.getElementById("af-lastdone")?.value;
    lastDoneAt = lastDoneVal ? new Date(lastDoneVal).toISOString() : null;
  } else {
    times = [...document.querySelectorAll(".time-input")].map(i => i.value).filter(Boolean).sort();
    if (!times.length) { alert("Add at least one time."); return; }
  }

  await saveActivity({ name, icon, schedule_type: sched, interval_hours, times, lastDoneAt }, existingId || null);
  await loadLastLogs();
  renderSettingsModal();
  renderMain();
};

window.backToSettings = function() { renderSettingsModal(); };
window.openSettings   = function() { renderSettingsModal(); };
window.openPetForm    = openPetForm;
window.openActivityForm = openActivityForm;
window.closeModal     = closeModal;
window.markDone       = markDone;

window.selectPet = async function(id) {
  selectedPetId = id;
  await loadLastLogs();
  renderMain();
};

// ─── Init ─────────────────────────────────────────────────────────────────
(async () => {
  await loadMembers();
  if (DB) {
    await initDb();
    await Promise.all([loadPets(), loadActivities()]);
    if (pets.length > 0) selectedPetId = pets[0].id;
    await loadLastLogs();
  }
  renderMain();
  // Refresh status colors every minute without a full DB reload
  refreshTimer = setInterval(() => { if (!modalEl) renderMain(); }, 60_000);
})();
</script>
</body>
</html>
